# The latest stable mise is the floor; CI pins the same version.
min_version = "2026.11.6"

[settings]
# Every tool, whether a config file, a task or the command line asks for it,
# comes from the locks; one with no entry fails instead of being looked up.
locked = true
# mise loads git:: task includes, and runs [deps] providers, only in
# experimental mode.
experimental = true
lockfile = true
# The platforms CI and contributors use, from the platforms answer. Without
# it, mise install fills every tool up to the platforms any tool already
# records, and rewrites the locks.
lockfile_platforms = ["linux-x64", "macos-arm64"]

# Every tool this root declares must match mise.lock or mise.<env>.lock.
[tool_config]
locked = true

[tools]
# jactionlint, the maintained fork mise points actionlint users to; it knows
# the Ubuntu 26.04 hosted runners.
jactionlint = "2.5.0"
# check:catalog reads the TOML catalogs as JSON.
yq = "4.54.1"
# check:docs-probes runs the catalog's check:docs, which reads cargo metadata
# with jq. Only cargo metadata --no-deps runs on the probe crates, so nothing
# compiles here.
rust = { version = "1.100.0", profile = "minimal" }
jq = "1.8.2"
# check:policy runs the tests of the workflow policy in policy/.
conftest = "0.71.1"

# mise-tasks/ holds this repository's task fragments and file tasks. An
# includes list replaces the default task dirs, so mise-tasks comes first; add
# pinned git:: catalogs after it.
[task_config]
includes = [
  # Pinned git:: catalogs follow mise-tasks.
  "mise-tasks",
  # template:check, template:off, and template:on, at actions main, 2026-11-13.
  "git::https://github.com/victor-software-house/actions.git//tasks/template.toml?ref=4f2318e8587711ead93246fc6a73174803264c3c",
]

# check:repo runs the template's shared checks and check:local, which lists
# this repository's own.
[tasks.verify]
description = "Every check CI runs"
depends = ["check:repo"]
