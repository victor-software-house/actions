name: CI

on:
  # A draft pull request runs no CI; marking it ready starts the run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Runs the same gate on demand on any branch: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

# The dev profile, which .miserc.toml loads locally, holds only the git hooks.
env:
  MISE_ENV: ci

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ !github.event.pull_request.draft }}
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The mise action exchanges the job's OIDC token for a session token.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The key and the job's OIDC token take mise's downloads through the
      # release mirror; a fork's pull request gets neither and uses GitHub.
      - name: Install locked tools
        uses: ./mise
        with:
          version: 2026.11.6
          mirror-url: ${{ secrets.RELEASE_MIRROR_URL }}
          mirror-key: ${{ secrets.RELEASE_MIRROR_CI_KEY }}
      - name: Verify
        run: mise run verify
