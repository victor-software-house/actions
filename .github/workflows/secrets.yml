# The reusable credential scan. A caller's workflow runs on pull requests and
# on a daily schedule, and holds only the job that calls this one, by commit:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review]
#     schedule:
#       - cron: "47 9 * * *"
#   jobs:
#     secrets:
#       if: ${{ !github.event.pull_request.draft }}
#       uses: victor-software-house/actions/.github/workflows/secrets.yml@<commit> # <tag>
#       with:
#         mise-version: <mise version>
#
# A pull request scans only its own commits; a scheduled or dispatched run
# scans the whole history. The pre-push hook scans only the commits it
# pushes, so history is scanned here once a day instead of on every push.
# gitleaks and the scan task come from the caller's hooks piece: gitleaks is
# pinned in mise.dev.toml, and `hooks:secrets:history` passes its arguments
# to `gitleaks git`.
name: Secrets

on:
  workflow_call:
    inputs:
      mise-version:
        description: The mise release to install
        type: string
        required: true
      runner:
        description: Final runner label for the credential scan
        type: string
        default: ubuntu-latest
      working-directory:
        description: The directory that holds the caller's mise.toml
        type: string
        default: .
    secrets:
      release-mirror-token:
        description: The release mirror's password, the RELEASE_MIRROR_TOKEN organization secret; without it mise downloads from GitHub
        required: false

permissions:
  contents: read

env:
  # github.com release downloads go through the organization's release mirror
  # when the caller passes its token; mise.lock's checksums still verify each
  # file. The token goes in verbatim, so it holds only URL- and JSON-safe
  # characters (hex), and GitHub masks it as a secret. Without it, as in a
  # fork's or Dependabot's pull request, mise downloads from GitHub, with
  # Astral's own mirror for uv and Python.
  MISE_URL_REPLACEMENTS: >-
    ${{ secrets.release-mirror-token && format('{{"https://github.com/": "https://ci:{0}@release-mirror.invalid/"}}', secrets.release-mirror-token) || '{"https://github.com/astral-sh/": "https://releases.astral.sh/github/"}' }}

jobs:
  secrets:
    name: Secrets
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # gitleaks is a dev tool; the hooks env keeps a Bun project's
      # dependency install out of `mise run`.
      MISE_ENV: dev,hooks
      # mise run installs every missing tool of the config before a task,
      # so the scan would wait on the Rust toolchain it never runs: on
      # 2026-10-27 a slow rustup download ran a scan to its 5-minute limit.
      # Only gitleaks, installed by its own step, is needed.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks reads the commits it scans from the history.
          fetch-depth: 0
      - name: Install mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: ${{ inputs.mise-version }}
          working_directory: ${{ inputs.working-directory }}
          cache: true
          install: false
      - name: Install gitleaks
        run: mise install gitleaks
      - name: Scan for credentials
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            mise run --no-deps hooks:secrets:history --log-opts="$BASE..$HEAD"
          else
            mise run --no-deps hooks:secrets:history
          fi
