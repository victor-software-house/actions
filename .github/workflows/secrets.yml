# The reusable credential scan. A caller's workflow runs on pull requests and
# on a daily schedule, and holds only the job that calls this one, by commit:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review]
#     schedule:
#       - cron: "47 9 * * *"
#   jobs:
#     secrets:
#       if: ${{ !github.event.pull_request.draft }}
#       uses: victor-software-house/actions/.github/workflows/secrets.yml@<commit> # <tag>
#       permissions:
#         contents: read
#         id-token: write
#       with:
#         mise-version: <mise version>
#
# A pull request scans only its own commits; a scheduled or dispatched run
# scans the whole history. The pre-push hook scans only the commits it
# pushes, so history is scanned here once a day instead of on every push.
# gitleaks and the scan task come from the caller's hooks piece: gitleaks is
# pinned in mise.dev.toml, and `hooks:secrets:history` passes its arguments
# to `gitleaks git`.
name: Secrets

on:
  workflow_call:
    inputs:
      mise-version:
        description: The mise release to install
        type: string
        required: true
      runner:
        description: Final runner label for the credential scan
        type: string
        default: ubuntu-latest
      working-directory:
        description: The directory that holds the caller's mise.toml
        type: string
        default: .

# `id-token: write` is a caller contract: the jobs that install tools exchange
# the job's OIDC token for a release mirror session token, and GitHub refuses
# to start a called workflow whose job asks for a permission its caller
# withholds.
permissions:
  contents: read

jobs:
  secrets:
    name: Secrets
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions:
      contents: read
      # The mise action's release mirror session token.
      id-token: write
    env:
      # gitleaks is a dev tool; the hooks env keeps a Bun project's
      # dependency install out of `mise run`.
      MISE_ENV: dev,hooks
      # mise run installs every missing tool of the config before a task,
      # so the scan would wait on the Rust toolchain it never runs: on
      # 2026-10-27 a slow rustup download ran a scan to its 5-minute limit.
      # Only gitleaks, installed by its own step, is needed.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      # Install from the URLs and checksums in the caller's lock, and write no
      # lock entries. Without it, mise resolves and verifies the provenance of
      # every task tool of the config under the dev,hooks profile, whose own
      # lock (mise.hooks.lock) a repository does not commit, and the job runs for
      # minutes. A tool the lock lacks fails the install instead, so the
      # caller's mise.dev.lock needs a gitleaks entry for the platform of
      # `inputs.runner` (linux-x64 for the default).
      MISE_LOCKED: "1"
      # Skip the caller's [hooks] entries (mise hooks, "Turn hooks off"): its
      # postinstall runs lefthook and the dependency install, neither of which
      # a scan needs.
      MISE_NO_HOOKS: "1"
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks reads the commits it scans from the history.
          fetch-depth: 0
      - name: Install mise
        uses: victor-software-house/actions/mise@bec0eef3f53f77bb73dd3969c005417218524f8a # main, 2026-11-09
        with:
          version: ${{ inputs.mise-version }}
          working_directory: ${{ inputs.working-directory }}
          install: false
      - name: Install gitleaks
        run: mise install gitleaks
      - name: Scan for credentials
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            mise run --no-deps hooks:secrets:history --log-opts="$BASE..$HEAD"
          else
            mise run --no-deps hooks:secrets:history
          fi
