# The reusable Rust CI workflow accepts final runner labels from its caller.
# Repository visibility, provider selection and machine sizes are resolved
# when the caller is rendered, never when this workflow executes.
# Only event-dependent behavior remains here: documentation-only checks and
# whether a run may commit its build cache.
name: Rust CI

on:
  workflow_call:
    inputs:
      mise-version:
        description: The mise release to install
        type: string
        required: true
      working-directory:
        description: The directory that holds the crate's mise.toml
        type: string
        default: .
      advisories:
        description: Run deny:advisories after verify
        type: boolean
        default: true
      semver:
        description: Run semver and cargo package, for a published crate
        type: boolean
        default: false
      timeout-minutes:
        description: Cancels a hung Verify, Semver or Package step
        type: number
        default: 8
      build-runner:
        description: JSON array of final build runner labels
        type: string
        default: '["ubuntu-latest"]'
      read-only-runner:
        description: JSON array of final labels for builds that must not commit cache state
        type: string
        default: '["ubuntu-latest"]'
      light-runner:
        description: Final runner label for lightweight jobs
        type: string
        default: ubuntu-latest
      cache-volume:
        description: The supplied build labels mount a persistent cache volume
        type: boolean
        default: false
      read-only-label:
        description: Final cache-safety label required in read-only runner labels when a cache volume is selected
        type: string
        default: ""
      cache-size-label:
        description: Final capacity label present in both supplied runner arrays, ending in the configured number of GB
        type: string
        default: ""
      cache-size:
        description: Explicit size in GB matching the supplied persistent cache labels
        type: number
        default: 0

permissions:
  contents: read

env:
  # Tests that create git repositories get main as their first branch,
  # whatever the runner image's git defaults to.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # The CI profile; local work loads dev from .miserc.toml, which CI never does.
  MISE_ENV: ci
  # mbx's automatic GC runs when each session ends. On Namespace the first
  # session to finish evicted about 10 of the 13 GiB just restored, so later
  # tasks of the same run missed. Collection runs once, after the build: the
  # GitHub cache is saved after Verify, and a cache volume is trimmed by its
  # own step at the end of the job.
  MBX_GC_AUTO: "0"

jobs:
  # Whether a pull request changes anything the build reads. Documentation is
  # the root's Markdown files, docs/, and openspec/. A documentation file
  # still counts as a build input when a Rust source names its path (a test
  # that reads it, include_str!), and every pull request builds
  # for a published crate, whose Package step ships documentation files.
  changes:
    name: Changes
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ${{ inputs.light-runner }}
    # One API call and a checkout to search; the caller supplies its runner.
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          list-files: json
          filters: |
            all:
              - '**'
            docs:
              - '*.md'
              - 'docs/**'
              - 'openspec/**'
      - name: Decide whether to build
        id: scope
        shell: bash
        env:
          ALL: ${{ steps.filter.outputs.all_count }}
          DOCS: ${{ steps.filter.outputs.docs_count }}
          DOCS_FILES: ${{ steps.filter.outputs.docs_files }}
          PUBLISHED: ${{ inputs.semver }}
        run: |
          build=false
          if [ "$ALL" != "$DOCS" ]; then
            build=true
          elif [ "$PUBLISHED" = true ]; then
            echo "A published crate packages its documentation, so every pull request builds."
            build=true
          else
            while IFS= read -r file; do
              # A Rust source that reads the file spells its path from the root,
              # as a test run there does, or a relative path that climbs to the
              # root and ends in it, as include_str! from a crate does.
              if git grep -qF -e "/$file\"" -e "\"$file\"" -e "\"./$file\"" -- '*.rs'; then
                echo "A Rust source reads $file, so the build reads it."
                build=true
                break
              fi
            done < <(jq -r '.[]' <<<"$DOCS_FILES")
          fi
          echo "build=$build" >>"$GITHUB_OUTPUT"

  build:
    name: Build and test
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    # Final labels come from the rendered caller. Only cache-write permission
    # depends on the event; a documentation-only change takes the light runner.
    runs-on: ${{ needs.changes.outputs.build == 'false' && inputs.light-runner || fromJSON((github.event_name == 'merge_group' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && inputs.build-runner || inputs.read-only-runner) }}
    # Every step carries its own limit, so the job is bounded by their sum.
    # A job limit cannot add the inputs' minutes to the fixed ones, since
    # expressions have no arithmetic, and one at the Verify limit cancelled
    # the cache export after a passing Verify.
    permissions:
      contents: read
      # A check:versions task reads a pull request that changes a manifest
      # version, to tell the Version PR apart from a hand edit.
      pull-requests: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - &validate-cache-inputs
        name: Validate final cache configuration
        if: inputs.cache-volume
        working-directory: ${{ github.workspace }}
        env:
          VALID_CONFIG: ${{ inputs.read-only-label != '' && contains(fromJSON(inputs.read-only-runner), inputs.read-only-label) && !contains(fromJSON(inputs.build-runner), inputs.read-only-label) && inputs.cache-size > 0 && inputs.cache-size-label != '' && contains(fromJSON(inputs.build-runner), inputs.cache-size-label) && contains(fromJSON(inputs.read-only-runner), inputs.cache-size-label) }}
          CAPACITY_LABEL: ${{ inputs.cache-size-label }}
          CAPACITY_GB: ${{ inputs.cache-size }}
        run: |
          if [ "$VALID_CONFIG" != true ]; then
            echo "::error::Invalid final cache configuration: supply coherent capacity and read-only safety labels."
            exit 1
          fi
          case "$CAPACITY_LABEL" in
            *-"$CAPACITY_GB"gb) ;;
            *)
              echo "::error::The final capacity label must match cache-size in GB."
              exit 1
              ;;
          esac
      - name: Check out repository
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A crate's test fixtures may live in a submodule; with none, this
          # checks out nothing more.
          submodules: true
          # A pull request checks out its merge commit; its first parent is
          # the base branch, which test selection diffs against.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      # The volume is mounted at /cache; the action bind-mounts each path into
      # it, so every later step reads and writes the volume. mise's installs
      # and rustup's toolchains share it, so the mise record of Rust and
      # rustup's components never come apart. A job that exits cleanly
      # commits the volume, whatever its steps' results; the next job forks
      # the newest commit on its node.
      - name: Mount the cache volume
        if: needs.changes.outputs.build != 'false' && inputs.cache-volume
        continue-on-error: true
        timeout-minutes: 3
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
            ~/.cargo
            ~/.cache/mbx
            ${{ github.workspace }}/${{ inputs.working-directory }}/target
      # Every job that installs the toolchain uses these three steps, by alias.
      # The GitHub mise cache is for GitHub-hosted runners, because a Namespace
      # runner keeps its installs on the volume; a job with no volume, the
      # static checks, sets TOOLCHAIN_CACHE to use it on every runner.
      # The cache is keyed on the mise lock files, which pin every tool a
      # locked install takes, and not on mise-action's default hash of every
      # config file: a template update edits mise.toml, and that default
      # dropped the cache for every pull request and merge group until the
      # next default-branch run saved one. A caller with no lock file keeps
      # the default key. A job that keeps the toolchains in the cache (the
      # static checks) adds "-rustup" to it, so it never restores an entry
      # saved without them.
      #
      # rustup's download timeout ends a stalled read after 30 seconds, but
      # not a slow one: a nightly download on 2026-10-26 ran a single
      # five-minute attempt to its limit and failed a merge group. So the
      # first attempt stops at 3 minutes, and a second one installs again.
      # GitHub's step timeout stops the action but not the `mise install` it
      # started, which keeps its install lock and keeps writing the
      # toolchain: on 2026-10-27 a retry waited its whole 5 minutes on the
      # lock "held by pid 1454", the first attempt's mise. So before the
      # retry, the first attempt's mise and rustup are stopped, then every
      # toolchain whose rustc does not run is removed with its update hash
      # and mise's record of it, and the retry installs it from scratch;
      # rustup's downloads stay.
      - &install-toolchain
        name: Install locked toolchain
        id: toolchain
        if: needs.changes.outputs.build != 'false'
        continue-on-error: true
        timeout-minutes: 3
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        env:
          RUSTUP_DOWNLOAD_TIMEOUT: "30"
          MISE_LOCK_HASH: ${{ hashFiles(format('{0}/mise*.lock', inputs.working-directory)) }}
        with:
          version: ${{ inputs.mise-version }}
          working_directory: ${{ inputs.working-directory }}
          cache: ${{ env.TOOLCHAIN_CACHE == 'true' || !inputs.cache-volume }}
          cache_key: '{{#if env.MISE_LOCK_HASH}}{{cache_key_prefix}}-{{platform}}-{{version}}{{#if mise_env}}-{{mise_env}}{{/if}}-lock-{{env.MISE_LOCK_HASH}}{{else}}{{default}}{{/if}}{{#if env.MISE_RUSTUP_HOME}}-rustup{{/if}}'
      - &remove-partial-toolchains
        name: Stop the first install and remove partly installed toolchains
        if: steps.toolchain.outcome == 'failure'
        # The retry runs whatever this step does.
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        # Each job has its own runner, so every mise and rustup process left
        # is the first attempt's. mise records a Rust version as installed
        # with a link under its data directory, named for the toolchain
        # without its host triple, and would skip a version whose link is
        # left; so the link goes too.
        run: |
          pkill -x mise || true
          pkill -x rustup || true
          for _ in $(seq 20); do
            pgrep -x mise > /dev/null || pgrep -x rustup > /dev/null || break
            sleep 1
          done
          pkill -KILL -x mise || true
          pkill -KILL -x rustup || true
          rustup_home=${MISE_RUSTUP_HOME:-${RUSTUP_HOME:-$HOME/.rustup}}
          mise_rust=${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}/installs/rust
          for dir in "$rustup_home"/toolchains/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            if ! "$dir/bin/rustc" --version > /dev/null 2>&1; then
              echo "Removing $name: its rustc does not run."
              rm -rf "$dir" "$rustup_home/update-hashes/$name" "${mise_rust:?}/${name%-*-*-*-*}"
            fi
          done
      - &install-toolchain-retry
        name: Install locked toolchain (retry)
        id: toolchain-retry
        if: steps.toolchain.outcome == 'failure'
        timeout-minutes: 5
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        env:
          RUSTUP_DOWNLOAD_TIMEOUT: "30"
          MISE_LOCK_HASH: ${{ hashFiles(format('{0}/mise*.lock', inputs.working-directory)) }}
        with:
          version: ${{ inputs.mise-version }}
          working_directory: ${{ inputs.working-directory }}
          cache: ${{ env.TOOLCHAIN_CACHE == 'true' || !inputs.cache-volume }}
          cache_key: '{{#if env.MISE_LOCK_HASH}}{{cache_key_prefix}}-{{platform}}-{{version}}{{#if mise_env}}-{{mise_env}}{{/if}}-lock-{{env.MISE_LOCK_HASH}}{{else}}{{default}}{{/if}}{{#if env.MISE_RUSTUP_HOME}}-rustup{{/if}}'
      # A documentation-only pull request: the repository's tools without the
      # Rust toolchain, then the documentation checks it defines. The mise
      # cache stays off, so this run never saves a cache without Rust that a
      # later build would restore.
      - name: Install the tools without Rust
        if: needs.changes.outputs.build == 'false'
        timeout-minutes: 3
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        env:
          MISE_DISABLE_TOOLS: rust
        with:
          version: ${{ inputs.mise-version }}
          working_directory: ${{ inputs.working-directory }}
          cache: false
      - name: Documentation checks
        if: needs.changes.outputs.build == 'false'
        timeout-minutes: 3
        shell: bash
        env:
          MISE_DISABLE_TOOLS: rust
        run: |
          tasks=()
          for task in lint:md lint:typos specs; do
            if mise tasks info "$task" >/dev/null 2>&1; then
              tasks+=("$task")
            fi
          done
          if [ "${#tasks[@]}" -eq 0 ]; then
            echo "This repository defines no documentation check."
            exit 0
          fi
          for task in "${tasks[@]}"; do
            mise run "$task"
          done
      # The objects payload carries mbx's compiled actions, whatever Cargo's
      # target layout; a restored target tree still recompiled most of the
      # clippy, doc-test, and cargo-semver-checks work.
      #
      # The cache only speeds the job up, so its result never decides the
      # job's. continue-on-error also covers the step's post action, which
      # saves the cache: the key is per commit, so a re-run of a cancelled or
      # finished run is refused with "Unable to reserve cache", which
      # jdx/mr-boxington-action v1.7.2 does not recognise as a refused save
      # (its pattern expects @actions/cache 6.2 output, 6.3 prints a workflow
      # warning) and reports as a failure. A failed step still shows its
      # error annotation.
      #
      # The runner applies the step's limit to the restore and to the post
      # action's export separately, and a timed-out stage fails under
      # continue-on-error like any other error. Measured 2026-10-22: the
      # slowest stage is ctl-core's export, 309 s; a's restore takes up to
      # 80 s and its export 80 s.
      #
      # The post action runs after every step that reads target/, so it
      # removes the Cargo target before exporting. With it kept, a's 24.5 GB
      # target left 15.8 GB free, and the 20 GB export failed with ENOSPC.
      - name: Cache builds with mbx
        if: needs.changes.outputs.build != 'false' && !inputs.cache-volume
        continue-on-error: true
        timeout-minutes: 7
        uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        with:
          working-directory: ${{ inputs.working-directory }}
          github-cache-mode: objects
          isolate-objects-cache: true
          # mbx saves on a push to the default branch and, with this, on a
          # workflow_dispatch run, which only a user with write access can
          # start. A caller that lands through a merge queue has no push run,
          # so its daily refresh dispatches CI on the default branch to keep
          # the cache pull requests restore from current; a schedule run
          # saves nothing.
          save-on-workflow-dispatch: true
          clean-target-before-export: true
      # On a cache volume mbx's store is already in place: the local backend
      # only sets mbx up, with no restore or export.
      - name: Cache builds with mbx on the volume
        if: needs.changes.outputs.build != 'false' && inputs.cache-volume
        continue-on-error: true
        timeout-minutes: 2
        uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        with:
          working-directory: ${{ inputs.working-directory }}
          backend: local
      # A pull request runs only the tests its diff can reach; a merge queue
      # run, a push and a dispatch run every test. The selection is a nextest
      # filterset in TEST_FILTERSET, which a repository's test task passes to
      # `cargo nextest run -E`; the catalog's cargo test ignores it and runs
      # everything. Each changed file belongs to the deepest workspace package
      # whose directory holds it, and the selection is those packages and
      # every package that depends on them through a path dependency of any
      # kind. A file that belongs to no package selects everything, except
      # documentation (the root's Markdown, docs/, openspec/) that no Rust
      # source names, which selects nothing. The whole workspace still builds:
      # building fewer packages would resolve features per package and
      # rebuild dependencies the full build already has.
      - name: Select tests from the diff
        if: github.event_name == 'pull_request' && needs.changes.outputs.build != 'false'
        timeout-minutes: 2
        shell: bash
        run: |
          prefix=$(git rev-parse --show-prefix)
          changed=()
          full=false
          while IFS= read -r file; do
            # The Changes job's documentation: it selects nothing unless a
            # Rust source names its path, as a test or include_str! does.
            if [[ "$file" == docs/* || "$file" == openspec/* || ("$file" != */* && "$file" == *.md) ]]; then
              if git grep -qF -e "/$file\"" -e "\"$file\"" -e "\"./$file\"" -- '*.rs'; then
                full=true
              fi
              continue
            fi
            if [[ "$file" != "$prefix"* ]]; then
              full=true
            fi
            changed+=("${file#"$prefix"}")
          done < <(git diff --name-only --no-renames HEAD^1 HEAD)
          if [ "$full" = true ] || [ "${#changed[@]}" -eq 0 ]; then
            echo "A change outside the workspace, a document a Rust source reads, or no source change: every test runs."
            exit 0
          fi
          metadata=$(mise x -- cargo metadata --no-deps --format-version 1 --locked)
          filterset=$(jq -r --args '
            .workspace_root as $root
            | [.packages[] | {name,
                dir: (.manifest_path | ltrimstr($root + "/") | rtrimstr("Cargo.toml") | rtrimstr("/")),
                deps: [.dependencies[] | select(.path) | .path | ltrimstr($root + "/")]}] as $pkgs
            | ($pkgs | map({key: .dir, value: .name}) | from_entries) as $by_dir
            | [$ARGS.positional[] as $f
                | [$pkgs[] | .dir as $d | select($d != "" and ($f | startswith($d + "/"))) | $d]
                | max_by(length) | if . then $by_dir[.] else null end] as $owners
            | if any($owners[]; . == null) then ""
              else
                ($pkgs | map({key: .name, value: [.deps[] as $p | $by_dir[$p] // empty]}) | from_entries) as $uses
                | {set: ($owners | unique), new: ($owners | unique)}
                | until(.new == [];
                    .set as $s
                    | ([$uses | to_entries[] | select(any(.value[]; IN($s[]))) | .key] - $s) as $n
                    | {set: ($s + $n | unique), new: $n})
                | [.set[] | "package(=\(.))"] | join(" | ")
              end' "${changed[@]}" <<<"$metadata")
          if [ -z "$filterset" ]; then
            echo "A changed file belongs to no workspace package: every test runs."
            exit 0
          fi
          echo "Tests run for: $filterset"
          echo "TEST_FILTERSET=$filterset" >>"$GITHUB_ENV"
      - name: Verify
        if: needs.changes.outputs.build != 'false'
        timeout-minutes: ${{ inputs.timeout-minutes }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run verify
      # A generation larger than the volume still commits, but the next job
      # starts from an empty volume, so the job trims what it leaves behind.
      # The largest workspace here measured a 24.5 GB target/ and a 13 to 20 GB
      # mbx bundle: mbx keeps a third of the volume, target/ is emptied once it
      # passes half, and the toolchains and Cargo's home take what is left.
      #
      # Namespace commits the volume when the job's main process exits cleanly,
      # which a failed step does not change, so a failed run's state is kept
      # too, and a job may fork a generation older than the last commit.
      # Neither can make a build use a wrong output. Cargo empties a unit's
      # fingerprint before compiling it and writes it only after the unit
      # succeeds, so an interrupted unit is rebuilt (fingerprint/mod.rs).
      # mbx publishes each object by atomic rename and checks it against its
      # content hash on first read, treating a mismatch as a miss
      # (docs/stability.md). mbx's collection still runs only after every
      # earlier step passed, so a red run never trims the store a green run
      # would reuse; the target/ size limit applies to every run.
      - name: Trim the cache volume
        if: ${{ !cancelled() && needs.changes.outputs.build != 'false' && inputs.cache-volume }}
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        env:
          SIZE_GB: ${{ inputs.cache-size }}
          JOB_STATUS: ${{ job.status }}
        # target/ first, so a failing mbx gc cannot leave it over its limit.
        run: |
          limit=$((SIZE_GB * 1000000000 / 2))
          if [ -d target ] && [ "$(du -sb target | cut -f1)" -gt "$limit" ]; then
            # target/ is a mount point, so only its contents go.
            echo "target/ is over $((SIZE_GB / 2)) GB, so its contents are removed."
            find target -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi
          if [ "$JOB_STATUS" = success ]; then
            MBX_GC_MAX_TOTAL_SIZE="$((SIZE_GB / 3))GiB" mbx gc
          else
            echo "An earlier step failed, so mbx's store is left as it is."
          fi
          du -sh ~/.local/share/mise ~/.rustup ~/.cargo ~/.cache/mbx target
          df -h /cache

  # The checks that compile nothing, on the caller's light runner, so a
  # formatting, policy or spelling failure reports in about a minute instead
  # of after the build. The build job's verify task runs the same tasks
  # again; each takes seconds there.
  static:
    name: Static checks
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.build != 'false' }}
    runs-on: ${{ inputs.light-runner }}
    # No cache volume here, so the toolchain steps use the GitHub mise cache
    # on every runner.
    env:
      TOOLCHAIN_CACHE: "true"
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # The GitHub mise cache saves only mise's data directory, and rustup
      # keeps the toolchains in ~/.rustup and ~/.cargo, so a cache hit still
      # downloaded both of them. Here they move under the data directory,
      # where the cache holds them; the jobs on the cache volume keep the
      # default paths, which the volume holds.
      - name: Keep the toolchains in the mise cache
        shell: bash
        run: |
          data_dir=${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}
          {
            echo "MISE_RUSTUP_HOME=$data_dir/rustup"
            echo "MISE_CARGO_HOME=$data_dir/cargo"
          } >> "$GITHUB_ENV"
      - *install-toolchain
      - *remove-partial-toolchains
      - *install-toolchain-retry
      # Each task runs when the repository defines it, and every one runs
      # even after another fails, so one run reports them all.
      - name: Static checks
        timeout-minutes: 5
        shell: bash
        run: |
          failed=()
          for task in check:toolchain format deny deps lint:typos lint:md specs; do
            if ! mise tasks info "$task" >/dev/null 2>&1; then
              continue
            fi
            echo "::group::mise run $task"
            mise run "$task" || failed+=("$task")
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Failed: ${failed[*]}"
            exit 1
          fi
      # Runs even when a static check failed, so one run reports both, but
      # not when setup failed: without the toolchain it would only repeat
      # that failure under another name. Either install attempt counts: a first
      # attempt that timed out reads failure even when the retry succeeded.
      - name: Advisories
        if: ${{ !cancelled() && inputs.advisories && (steps.toolchain.outcome == 'success' || steps.toolchain-retry.outcome == 'success') }}
        timeout-minutes: 2
        run: mise run deny:advisories

  # A published crate's semver comparison and cargo package, beside the build
  # instead of after it. The job never writes the build cache: on a Namespace
  # runner it mounts the volume read-only on every event, because parallel
  # jobs that commit one tag overwrite each other (last write wins, no merge),
  # and on a GitHub-hosted runner it saves under its own key suffix, so it
  # never races the build job for one key.
  publish:
    name: Publish checks
    needs: changes
    if: ${{ inputs.semver && !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.build != 'false' }}
    runs-on: ${{ fromJSON(inputs.read-only-runner) }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - *validate-cache-inputs
      - name: Check out repository
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Mount the cache volume
        if: inputs.cache-volume
        continue-on-error: true
        timeout-minutes: 3
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
            ~/.cargo
            ~/.cache/mbx
            ${{ github.workspace }}/${{ inputs.working-directory }}/target
      - *install-toolchain
      - *remove-partial-toolchains
      - *install-toolchain-retry
      # Restores the newest objects under the shared prefix, the build job's
      # included, and saves its own entry from the default branch.
      - name: Cache builds with mbx
        if: ${{ !inputs.cache-volume }}
        continue-on-error: true
        timeout-minutes: 7
        uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        with:
          working-directory: ${{ inputs.working-directory }}
          github-cache-mode: objects
          isolate-objects-cache: true
          cache-key-suffix: publish
          save-on-workflow-dispatch: true
          clean-target-before-export: true
      - name: Cache builds with mbx on the volume
        if: inputs.cache-volume
        continue-on-error: true
        timeout-minutes: 2
        uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        with:
          working-directory: ${{ inputs.working-directory }}
          backend: local
      # Compares the public API with the last release on crates.io.
      - name: Semver
        timeout-minutes: ${{ inputs.timeout-minutes }}
        run: mise run semver
      # --workspace packages every member of a workspace, and the one package
      # of a single crate.
      - name: Package
        timeout-minutes: ${{ inputs.timeout-minutes }}
        run: mise x -- cargo package --locked --all-features --workspace

  # The one check a ruleset requires: it reports on every pull request and
  # merge queue run, and fails when any job it needs failed or was cancelled.
  # A job skipped by its own condition (a documentation-only pull request, a
  # crate with semver off) counts as passing. With only a downstream job
  # required, an upstream failure would skip it and read as green; this job
  # runs always() so that cannot happen, and its name keeps the required
  # check `verify / Verify` while the jobs behind it change.
  verify:
    name: Verify
    needs: [changes, static, build, publish]
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ${{ inputs.light-runner }}
    timeout-minutes: 2
    steps:
      - name: Report the jobs
        shell: bash
        env:
          STATIC: ${{ needs.static.result }}
          BUILD: ${{ needs.build.result }}
          PUBLISH: ${{ needs.publish.result }}
        run: |
          echo "Static checks: $STATIC; Build and test: $BUILD; Publish checks: $PUBLISH"
          for result in "$STATIC" "$BUILD" "$PUBLISH"; do
            if [ "$result" = failure ] || [ "$result" = cancelled ]; then
              exit 1
            fi
          done
