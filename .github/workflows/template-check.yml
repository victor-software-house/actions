# The reusable drift check. A caller's workflow runs on pull requests, on
# pushes to the default branch, and on a daily schedule, and holds only the
# job that calls this one, by commit, passing the template-reader App's key:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review]
#     push:
#       branches: [main]
#     schedule:
#       - cron: "17 9 * * *"
#   concurrency:
#     group: template-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
#     cancel-in-progress: true
#   jobs:
#     template:
#       if: ${{ !github.event.pull_request.draft }}
#       uses: victor-software-house/actions/.github/workflows/template-check.yml@<commit> # <tag>
#       permissions:
#         contents: read
#         issues: write
#       with:
#         mise-version: <mise version>
#       secrets:
#         TEMPLATES_APP_PRIVATE_KEY: ${{ secrets.TEMPLATES_APP_PRIVATE_KEY }}
#
# The caller includes tasks/template.toml, whose template:check does the work,
# so a developer runs the same check with `mise run template:check`.
#
# Only an update pull request, one that changes .copier-answers.yml, fails on
# drift: it must reach the newest tag. Any other pull request reports a newer
# tag as a notice, so a new tag fails no unrelated pull request. A push or a
# scheduled run keeps one open issue per working directory while the newest
# tag would change the repository, and closes it once nothing is left to take.
name: Template check

on:
  workflow_call:
    inputs:
      mise-version:
        description: The mise release to install
        type: string
        required: true
      working-directory:
        description: The directory that holds .copier-answers.yml and its mise.toml
        type: string
        default: .
    secrets:
      TEMPLATES_APP_PRIVATE_KEY:
        description: The private key of the App that reads the template; its client id is the TEMPLATES_APP_CLIENT_ID variable
        required: true

permissions:
  contents: read

env:
  # The CI profile; local work loads dev from .miserc.toml, which CI never does.
  MISE_ENV: ci

jobs:
  template:
    name: Template
    # A pull request from a fork gets no secrets and cannot read the template,
    # so the check is skipped there instead of failing. A draft pull request
    # runs no check; marking it ready starts the run.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !github.event.pull_request.draft
    # GitHub checks these against the caller's grant when the run starts,
    # whatever the event, so a caller grants issues: write in the same change
    # that moves its pin to this workflow.
    permissions:
      contents: read
      # The drift issue, written only on the default branch.
      issues: write
    # Runs outside pull requests take turns, so two of them never open two
    # issues. Each pull request run has a group of its own.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('template-{0}', github.run_id) || format('template-report-{0}', inputs.working-directory) }}
    # One copier update with no build: the smallest Namespace shape, which
    # bills half of a 4x8.
    runs-on: ${{ github.event.repository.private && 'nscloud-ubuntu-24.04-amd64-2x4' || 'ubuntu-latest' }}
    defaults:
      run:
        # GitHub runs bash with pipefail only when the shell is named.
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request checks out its merge commit; its first parent is
          # the base branch, which the next step diffs against.
          fetch-depth: 2
      - name: Choose how drift reports
        id: drift
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ] && ! git diff --quiet HEAD^1 HEAD -- .copier-answers.yml; then
            echo "mode=fail" >>"$GITHUB_OUTPUT"
          else
            echo "mode=notice" >>"$GITHUB_OUTPUT"
          fi
      # The answers file names the template, so this workflow names none.
      - name: Find the template
        id: template
        run: |
          src=$(sed -n 's/^_src_path: //p' .copier-answers.yml)
          case "$src" in
            https://github.com/*/*) ;;
            *)
              echo "::error::_src_path is not a GitHub HTTPS URL: $src"
              exit 1
              ;;
          esac
          repo=${src#https://github.com/}
          repo=${repo%.git}
          {
            echo "owner=${repo%%/*}"
            echo "name=${repo#*/}"
            echo "url=https://github.com/$repo"
          } >>"$GITHUB_OUTPUT"
      - name: Mint a token that reads the template
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TEMPLATES_APP_CLIENT_ID }}
          private-key: ${{ secrets.TEMPLATES_APP_PRIVATE_KEY }}
          owner: ${{ steps.template.outputs.owner }}
          repositories: ${{ steps.template.outputs.name }}
          permission-contents: read
      - name: Install mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: ${{ inputs.mise-version }}
          working_directory: ${{ inputs.working-directory }}
          cache: true
          # The check needs only its own tools, not the repository's toolchain.
          install: false
      - name: Install the check's tools
        run: |
          spec=$(mise tasks info template:check --json | jq -r '.tools | to_entries[] | "\(.key)@\(.value)"')
          mapfile -t tools <<<"$spec"
          mise install "${tools[@]}"
      - name: Template version
        env:
          # Only this step clones the template, so it alone carries the token.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.app.outputs.token }}@github.com/${{ steps.template.outputs.owner }}/${{ steps.template.outputs.name }}.insteadOf
          GIT_CONFIG_VALUE_0: ${{ steps.template.outputs.url }}
          TEMPLATE_DRIFT: ${{ steps.drift.outputs.mode }}
        # A Bun project's [deps.bun] would run bun install first, and the
        # check installs no bun.
        run: mise run --skip-tools --no-deps template:check
      # template:check left the newest tag's update in the working tree, so
      # the files it changes are the drift.
      - name: Report drift in an issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIRECTORY: ${{ inputs.working-directory }}
        run: |
          # Only the default branch's state is drift; any other ref, such as a
          # manual run on a feature branch, leaves the issue alone. The API
          # answers for every event, whatever its payload carries.
          repo=$(gh api "repos/$GH_REPO" --jq '"\(.default_branch) \(.has_issues)"')
          read -r default_branch has_issues <<<"$repo"
          if [ "$GITHUB_REF" != "refs/heads/$default_branch" ]; then
            echo "$GITHUB_REF is not the default branch, so no drift issue changes"
            exit 0
          fi
          if [ "$has_issues" != true ]; then
            echo "::notice::Issues are off in $GH_REPO, so drift is reported only in this run."
            exit 0
          fi
          title="Template update available"
          if [ "$DIRECTORY" != . ]; then
            title="$title in $DIRECTORY"
          fi
          issue=$(gh issue list --state open --limit 500 --json number,title | jq -r --arg title "$title" '[.[] | select(.title == $title) | .number][0] // empty')
          latest=$(sed -n 's/^_commit: //p' .copier-answers.yml)
          current=$(git show HEAD:./.copier-answers.yml | sed -n 's/^_commit: //p')
          changes=$(git status --short --untracked-files=all -- . ":(exclude).copier-answers.yml")
          if [ -z "$changes" ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "Template $latest leaves nothing to update in $DIRECTORY."
            fi
            exit 0
          fi
          body=$(mktemp)
          {
            echo "Template $latest changes these files in \`$DIRECTORY\`, which records $current:"
            echo
            echo '```text'
            echo "$changes"
            echo '```'
            echo
            echo "Update in \`$DIRECTORY\` with \`copier update --defaults --vcs-ref $latest\` and open a pull request."
            echo "This issue closes when a later check on the default branch finds nothing left to update."
          } >"$body"
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file "$body"
          else
            gh issue create --title "$title" --body-file "$body"
          fi
