# The reusable Homebrew tap CI workflow accepts a final runner label from its
# caller. It checks a tap repository's style and that every formula and cask
# in it reads, behind one `Style` job. It runs no `brew audit --online`: a
# private tap's homepages answer 404 to the audit's request.
name: Homebrew tap CI

on:
  workflow_call:
    inputs:
      runner:
        description: Final runner label for the job
        type: string
        default: ubuntu-26.04
      timeout-minutes:
        description: Cancels a hung job
        type: number
        default: 5

permissions:
  contents: read

jobs:
  style:
    name: Style
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      # The action fetches the tap's commit itself, replaces the workspace
      # with it and taps it, so no checkout step precedes it. Its token input
      # lets it fetch a private tap.
      - name: Set up Homebrew
        id: homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1, 2026-11-14
        with:
          token: ${{ github.token }}
      # tap-name is the owner and repository without the homebrew- prefix,
      # in lower case, as the action registers the tap.
      # brew style lints every Ruby and shell file under the paths it gets, and
      # a tap name stands for the whole repository. Homebrew's style covers the
      # tap's formula, cask and command directories; the repository's own
      # scripts, such as its mise tasks, follow the repository's own lints.
      - name: Style
        env:
          TAP: ${{ steps.homebrew.outputs.tap-name }}
        run: |
          cd "$(brew --repository "$TAP")"
          paths=()
          for dir in Formula HomebrewFormula Casks cmd; do
            if [[ -d $dir ]]; then
              paths+=("$dir")
            fi
          done
          # A tap with neither formula directory keeps its formulae at its root.
          if [[ ! -d Formula && ! -d HomebrewFormula ]]; then
            shopt -s nullglob
            paths+=(./*.rb)
          fi
          if (( ${#paths[@]} == 0 )); then
            echo "::error::the tap has no formula, cask or command to check"
            exit 1
          fi
          brew style "${paths[@]}"
      - name: Read every formula and cask
        env:
          TAP: ${{ steps.homebrew.outputs.tap-name }}
        run: brew readall "$TAP"
