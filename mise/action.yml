name: mise
description: >-
  Install the locked mise tools, downloading github.com release assets through
  the organization's release mirror when the caller passes its token, and
  save the tools cache
author: victor-software-house

inputs:
  version:
    description: The mise version to install
    required: true
  mirror-url:
    description: The release mirror's address
    default: https://releases.vsh.dev
  mirror-token:
    description: The release mirror's password, the RELEASE_MIRROR_TOKEN organization secret
    default: ""
  install:
    description: Install the tools; "false" only sets mise up
    default: "true"
  install_args:
    description: Arguments for mise install, such as the tools of one job
    default: ""
  working_directory:
    description: The directory that mise runs in
    default: ""
  cache:
    description: Read and write the tools cache; "false" turns it off
    default: "true"
  cache_key:
    description: The tools cache key, as jdx/mise-action's cache_key template; empty takes its default
    default: ""
  cache_save_post:
    description: Save the tools cache after the job, with the task tools in it; "false" saves it right after the install
    default: "true"

runs:
  using: composite
  steps:
    # A fork's pull request gets no secrets, so it downloads from GitHub, with
    # Astral's own mirror for uv and Python. The password goes in the URL's
    # userinfo, which mise sends as HTTP Basic credentials and redacts from
    # its logs; GitHub masks it as a secret.
    - name: Route downloads through the release mirror
      shell: sh
      env:
        MIRROR_URL: ${{ inputs.mirror-url }}
        MIRROR_TOKEN: ${{ inputs.mirror-token }}
      run: |
        if [ -n "$MIRROR_TOKEN" ]; then
          # The token goes into a URL and a JSON string unescaped, so it may
          # hold only URL-safe characters.
          case "$MIRROR_TOKEN" in
            *[!A-Za-z0-9._~-]*) echo "::error::mirror-token holds a character outside [A-Za-z0-9._~-]"; exit 1 ;;
          esac
          mirror="${MIRROR_URL%/}"
          case "$mirror" in *://*) ;; *) mirror="https://$mirror" ;; esac
          echo "MISE_URL_REPLACEMENTS={\"https://github.com/\": \"${mirror%%://*}://ci:$MIRROR_TOKEN@${mirror#*://}/\"}" >>"$GITHUB_ENV"
        else
          echo 'MISE_URL_REPLACEMENTS={"https://github.com/astral-sh/": "https://releases.astral.sh/github/"}' >>"$GITHUB_ENV"
        fi

    # jdx/mise-action downloads mise itself from github.com, outside the URL
    # replacements. It keeps a mise it finds in its data directory's bin
    # once the binary matches SHASUMS256-<version>.txt there and the
    # minisign signature beside it verifies, so this step fetches the three
    # files from the mirror and the action still checks them against mise's
    # signing key. Windows, and a run without the token, download from
    # GitHub as before.
    - name: Fetch mise through the release mirror
      if: inputs.mirror-token != '' && runner.os != 'Windows'
      shell: sh
      env:
        VERSION: ${{ inputs.version }}
        MIRROR_URL: ${{ inputs.mirror-url }}
        MIRROR_TOKEN: ${{ inputs.mirror-token }}
      run: |
        set -eu
        version=${VERSION#v}
        case "$RUNNER_OS" in
          macOS) os=macos ;;
          *) os=linux ;;
        esac
        case "$RUNNER_ARCH" in
          ARM64) arch=arm64 ;;
          *) arch=x64 ;;
        esac
        target="$os-$arch"
        if [ "$os" = linux ] && ldd --version 2>&1 | grep -qi musl; then
          target="$target-musl"
        fi
        # The directory jdx/mise-action takes when no mise_dir is given.
        dir="${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}/bin"
        if [ -e "$dir/mise" ]; then
          exit 0
        fi
        mirror="${MIRROR_URL%/}"
        case "$mirror" in *://*) ;; *) mirror="https://$mirror" ;; esac
        base="$mirror/jdx/mise/releases/download/v$version"
        mkdir -p "$dir"
        fetch() {
          curl -fsSL --retry 3 --user "ci:$MIRROR_TOKEN" -o "$2" "$base/$1"
        }
        fetch SHASUMS256.txt "$dir/SHASUMS256-$version.txt"
        fetch SHASUMS256.txt.minisig "$dir/SHASUMS256-$version.txt.minisig"
        # The tarball is a third the size of the bare binary it holds, and
        # the binary inside matches the bare one's checksum.
        fetch "mise-v$version-$target.tar.gz" "$dir/mise.tar.gz"
        tar -xzf "$dir/mise.tar.gz" -O mise/bin/mise >"$dir/mise.part"
        rm "$dir/mise.tar.gz"
        chmod +x "$dir/mise.part"
        mv "$dir/mise.part" "$dir/mise"

    - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      with:
        version: ${{ inputs.version }}
        working_directory: ${{ inputs.working_directory }}
        install: ${{ inputs.install }}
        install_args: ${{ inputs.install_args }}
        cache: ${{ inputs.cache }}
        cache_key: ${{ inputs.cache_key }}
        cache_save_post: ${{ inputs.cache_save_post }}
