name: mise
description: >-
  Install the locked mise tools, downloading github.com release assets through
  the organization's release mirror when the caller passes its token, and
  save the tools cache
author: victor-software-house

inputs:
  version:
    description: The mise version to install
    required: true
  mirror-url:
    description: The release mirror's address
    default: https://release-mirror.invalid
  mirror-token:
    description: The release mirror's password, the RELEASE_MIRROR_TOKEN organization secret
    default: ""
  install:
    description: Install the tools; "false" only sets mise up
    default: "true"
  install_args:
    description: Arguments for mise install, such as the tools of one job
    default: ""
  working_directory:
    description: The directory that mise runs in
    default: ""
  cache:
    description: Read and write the tools cache; "false" turns it off
    default: "true"
  cache_key:
    description: The tools cache key, as jdx/mise-action's cache_key template; empty takes its default
    default: ""
  cache_save_post:
    description: Save the tools cache after the job, with the task tools in it; "false" saves it right after the install
    default: "true"
  cache_save:
    description: Write the tools cache; "false" only reads it
    default: "true"
  cache_key_prefix:
    description: The prefix of the default tools cache key; change it to start a new cache
    default: mise-v1
  sha256:
    description: The SHA-256 checksum the mise binary must match; empty checks only mise's signed checksums
    default: ""

runs:
  using: composite
  steps:
    # A fork's pull request gets no secrets, so it downloads from GitHub, with
    # Astral's own mirror for uv and Python. The password goes in the URL's
    # userinfo, which mise sends as HTTP Basic credentials and redacts from
    # its logs; GitHub masks it as a secret.
    - name: Route downloads through the release mirror
      shell: sh
      env:
        MIRROR_URL: ${{ inputs.mirror-url }}
        MIRROR_TOKEN: ${{ inputs.mirror-token }}
      run: |
        if [ -n "$MIRROR_TOKEN" ]; then
          # The token goes into a URL and a JSON string unescaped, so it may
          # hold only URL-safe characters.
          case "$MIRROR_TOKEN" in
            *[!A-Za-z0-9._~-]*) echo "::error::mirror-token holds a character outside [A-Za-z0-9._~-]"; exit 1 ;;
          esac
          mirror="${MIRROR_URL%/}"
          case "$mirror" in *://*) ;; *) mirror="https://$mirror" ;; esac
          echo "MISE_URL_REPLACEMENTS={\"https://github.com/\": \"${mirror%%://*}://ci:$MIRROR_TOKEN@${mirror#*://}/\"}" >>"$GITHUB_ENV"
        else
          echo 'MISE_URL_REPLACEMENTS={"https://github.com/astral-sh/": "https://releases.astral.sh/github/"}' >>"$GITHUB_ENV"
        fi

    # The fork applies MISE_URL_REPLACEMENTS to its own downloads of mise
    # (the binary, SHASUMS256.txt, its signature and the packslip), after it
    # restores the tools cache, so a cache hit downloads nothing. It falls
    # back to GitHub with a warning when the mirror fails.
    - uses: victor-software-house/mise-action@c9863afe435120b2e4d9494d8fbb2895739a7ea8 # v5.2.5.1
      with:
        version: ${{ inputs.version }}
        working_directory: ${{ inputs.working_directory }}
        install: ${{ inputs.install }}
        install_args: ${{ inputs.install_args }}
        cache: ${{ inputs.cache }}
        cache_key: ${{ inputs.cache_key }}
        cache_save_post: ${{ inputs.cache_save_post }}
        cache_save: ${{ inputs.cache_save }}
        cache_key_prefix: ${{ inputs.cache_key_prefix }}
        sha256: ${{ inputs.sha256 }}
