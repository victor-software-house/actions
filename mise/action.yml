name: mise
description: >-
  Install the locked mise tools, downloading github.com release assets through
  the organization's release mirror when the job can prove its identity with
  an OIDC token, and save the tools cache
author: victor-software-house

inputs:
  version:
    description: The mise version to install
    required: true
  mirror-url:
    description: >-
      The release mirror's address, from an organization secret; empty
      downloads from GitHub
    default: ""
  mirror-key:
    description: >-
      The key in the user name of a CI job's mirror login, from an
      organization secret. It passes the mirror's edge rule and opens nothing
      alone; empty sends the exchange and the downloads without it
    default: ""
  install:
    description: Install the tools; "false" only sets mise up
    default: "true"
  install_args:
    description: Arguments for mise install, such as the tools of one job
    default: ""
  working_directory:
    description: The directory that mise runs in
    default: ""
  cache:
    description: Read and write the tools cache; "false" turns it off
    default: "true"
  cache_key:
    description: The tools cache key, as jdx/mise-action's cache_key template; empty takes its default
    default: ""
  cache_save_post:
    description: Save the tools cache after the job, with the task tools in it; "false" saves it right after the install
    default: "true"
  cache_save:
    description: Write the tools cache; "false" only reads it
    default: "true"
  cache_key_prefix:
    description: The prefix of the default tools cache key; change it to start a new cache
    default: mise-v1
  sha256:
    description: The SHA-256 checksum the mise binary must match; empty checks only mise's signed checksums
    default: ""

runs:
  using: composite
  steps:
    # A job that grants id-token: write proves its identity to the mirror
    # with an OIDC token for the mirror's address, which lasts five minutes,
    # and gets a session token that lasts six hours in exchange. A job
    # without the permission, such as a fork's pull request, downloads from
    # GitHub, with Astral's own mirror for uv and Python.
    # With mirror-key, the exchange and every download carry the user name
    # ci.<key>, which the mirror's edge rule admits; the key opens nothing
    # without the session token. The login goes in the replacement URL's
    # userinfo, which mise sends as HTTP Basic credentials and redacts from
    # its logs; the step masks the key and the token in every log.
    # curl reads each credential from its config on stdin, so none appears in
    # a process's arguments.
    # curl starts no retry after 20 seconds and stops any attempt after 10,
    # so each of the two requests ends within 30 seconds, and a mirror that
    # hangs leaves the job on GitHub well inside the caller's step timeout.
    - name: Route downloads through the release mirror
      shell: sh
      env:
        MIRROR_URL: ${{ inputs.mirror-url }}
        MIRROR_KEY: ${{ inputs.mirror-key }}
      run: |
        mirror="${MIRROR_URL%/}"
        session=""
        user="ci"
        # The address goes into GITHUB_ENV, so a value with any character
        # outside a plain URL, a newline above all, is refused.
        case "$mirror" in
          *[!A-Za-z0-9._~:/-]*)
            echo "::warning::The mirror-url input holds characters an address cannot carry; mise downloads from GitHub"
            mirror=""
            ;;
        esac
        if [ -n "$mirror" ]; then
          case "$mirror" in *://*) ;; *) mirror="https://$mirror" ;; esac
          # The address comes from a secret; keep it, and its host, out of the logs.
          echo "::add-mask::$mirror"
          echo "::add-mask::${mirror#*://}"
        fi
        if [ -n "$MIRROR_KEY" ]; then
          echo "::add-mask::$MIRROR_KEY"
          # The key goes into a URL and a JSON string unescaped.
          case "$MIRROR_KEY" in
            *[!A-Za-z0-9_~-]*) echo "::warning::The mirror key holds characters a user name cannot carry; the job sends no key" ;;
            *) user="ci.$MIRROR_KEY" ;;
          esac
        fi
        if [ -z "$mirror" ]; then
          echo "::notice::No mirror-url, so mise downloads from GitHub"
        elif [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::notice::This job has no OIDC token, so mise downloads from GitHub; grant id-token: write to download through the release mirror"
        else
          # A failed request leaves the reply empty, and the job downloads
          # from GitHub below.
          answer=$(printf 'header = "Authorization: bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" |
            curl -fsS --connect-timeout 5 --max-time 10 --retry 2 --retry-max-time 20 --config - "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$mirror") || answer=""
          oidc=$(printf '%s' "$answer" | sed -n 's/.*"value" *: *"\([^"]*\)".*/\1/p')
          if [ -n "$oidc" ]; then
            echo "::add-mask::$oidc"
            # With a key, the OIDC token is the password of the ci.<key>
            # login; without one, it is a Bearer token.
            if [ "$user" = ci ]; then
              credential=$(printf 'header = "Authorization: Bearer %s"\n' "$oidc")
            else
              credential=$(printf 'user = "%s:%s"\n' "$user" "$oidc")
            fi
            reply=$(printf '%s\n' "$credential" |
              curl -fsS --connect-timeout 5 --max-time 10 --retry 2 --retry-max-time 20 --config - -X POST "$mirror/token" || true)
            session=$(printf '%s' "$reply" | sed -n 's/.*"token" *: *"\([^"]*\)".*/\1/p')
            expires=$(printf '%s' "$reply" | sed -n 's/.*"expires_at" *: *"\([^"]*\)".*/\1/p')
          fi
          # The token goes into a URL and a JSON string unescaped, so it may
          # hold only URL-safe characters.
          case "$session" in
            *[!A-Za-z0-9._~-]*) session="" ;;
          esac
          if [ -n "$session" ]; then
            echo "::add-mask::$session"
            echo "Downloads go through $mirror with a session token valid until $expires"
          else
            echo "::warning::Could not get a session token from $mirror; mise downloads from GitHub"
          fi
        fi
        if [ -n "$session" ]; then
          echo "MISE_URL_REPLACEMENTS={\"https://github.com/\": \"${mirror%%://*}://$user:$session@${mirror#*://}/\"}" >>"$GITHUB_ENV"
        else
          echo 'MISE_URL_REPLACEMENTS={"https://github.com/astral-sh/": "https://releases.astral.sh/github/"}' >>"$GITHUB_ENV"
        fi

    # The fork applies MISE_URL_REPLACEMENTS to its own downloads of mise
    # (the binary, SHASUMS256.txt, its signature and the packslip), after it
    # restores the tools cache, so a cache hit downloads nothing. It falls
    # back to GitHub with a warning when the mirror fails.
    - uses: victor-software-house/mise-action@a8e00ff954888fde747320eba3fe65e6246d24ad # v5.2.7.1
      with:
        version: ${{ inputs.version }}
        working_directory: ${{ inputs.working_directory }}
        install: ${{ inputs.install }}
        install_args: ${{ inputs.install_args }}
        cache: ${{ inputs.cache }}
        cache_key: ${{ inputs.cache_key }}
        cache_save_post: ${{ inputs.cache_save_post }}
        cache_save: ${{ inputs.cache_save }}
        cache_key_prefix: ${{ inputs.cache_key_prefix }}
        sha256: ${{ inputs.sha256 }}
