# The tasks that keep a repository on its Copier template. Include this file
# by commit, after mise-tasks:
#
#   [task_config]
#   includes = [
#     "mise-tasks",
#     "git::https://github.com/victor-software-house/actions.git//tasks/template.toml?ref=<commit>",
#   ]
#
# Each task declares its tools, so the including repository pins none of them;
# `mise lock` records them in its lock. Copier runs through uvx, at the
# version the template pins as "pypi:copier" in its own mise.toml.

["template:check"]
description = "Fails when the newest template tag would change this repository"
tools = { uv = "0.13.1", python = "3.14.8" }
shell = "bash -c"
# A newer tag that renders the same files passes with a notice: the
# repository takes the new _commit with its next real template change.
run = '''
set -euo pipefail
answers=.copier-answers.yml
recorded() { sed -n 's/^_commit: //p' "$answers"; }

current=$(recorded)
src=$(sed -n 's/^_src_path: //p' "$answers")
# Copier takes the newest release tag and skips prereleases, so only vX.Y.Z
# tags count.
tag=$(git ls-remote --tags --refs "$src" 'v*' | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -n 1)
if [ -z "$tag" ]; then
  echo "::error::No release tag in $src."
  exit 1
fi
template=$(mktemp -d)
trap 'rm -rf "$template"' EXIT
git clone --quiet --depth 1 --branch "$tag" "$src" "$template"
# The template pins the copier that renders it, so the check runs the version
# each tag was tested with and pins none itself.
copier=$(sed -n 's/^"pypi:copier" = "\(.*\)"$/\1/p' "$template/mise.toml")
if [ -z "$copier" ]; then
  echo "::error::Template $tag pins no copier in mise.toml."
  exit 1
fi
# copier update refuses a dirty tree, so whatever it changes is what the
# newest tag brings.
uvx "copier@$copier" update --quiet --defaults --vcs-ref "$tag"
latest=$(recorded)
changes=$(git status --porcelain --untracked-files=all -- . ":(exclude)$answers")
if [ -n "$changes" ]; then
  echo "::error::Template $latest changes this repository, which records $current. Run copier update and commit the result."
  git status --short -- . ":(exclude)$answers"
  git diff -- . ":(exclude)$answers"
  exit 1
fi
if [ "$latest" = "$current" ]; then
  echo "On the newest template tag, $current (copier $copier)."
else
  echo "::notice::Template $latest renders no change here; the repository records $current."
fi
'''
