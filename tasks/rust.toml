# The standard Rust tasks, identical in every repository that includes them.
# Include this file by commit, after mise-tasks:
#
#   [settings]
#   experimental = true  # mise loads git:: task includes only with this on
#
#   [task_config]
#   includes = [
#     "mise-tasks",
#     "git::https://github.com/victor-software-house/actions.git//tasks/rust.toml?ref=<commit>",
#   ]
#
# The catalog names no toolchain version. The including repository sets them
# in its mise.toml [env]: RUSTFMT_TOOLCHAIN ("+nightly-YYYY-MM-DD") when format
# runs on a nightly for rustfmt's unstable options, and RUST_NIGHTLY, the
# nightly doc builds on as docs.rs does. Its mise.toml pins the tools these
# tasks call, and defines verify from the tasks it wants, beside its own
# check:features and check:repo.
# Every task that resolves dependencies passes --locked, so a Cargo.lock that
# no longer matches Cargo.toml fails verify here, as it fails a release build
# that passes --locked.
["check:toolchain"]
description = "mise.toml, rust-toolchain.toml, and rust-version pin the same stable"
# pipefail: a failing cargo metadata or jq must fail the task, not pass it.
shell = "bash -o pipefail -c"
run = [
  '[ "$(rustc -V)" = "$(env -u RUSTUP_TOOLCHAIN RUSTUP_AUTO_INSTALL=0 rustc -V)" ] || { echo "✘ mise.toml and rust-toolchain.toml pin different toolchains"; exit 1; }',
  '''cargo metadata --no-deps --locked --format-version 1 | jq --arg v "$(rustc -V | cut -d' ' -f2)" '[.packages[] | select(.rust_version != $v) | .name] | if length > 0 then error("✘ rust-version differs from the pinned stable in: \(join(", "))") else empty end' ''',
]

[format]
description = "rustfmt check, on RUSTFMT_TOOLCHAIN when set"
run = "cargo ${RUSTFMT_TOOLCHAIN:-} fmt --all -- --check"

[lint]
description = "clippy -D warnings"
# --workspace in lint, test, and test:doc: without it cargo selects the
# default members, which is only the root package of a workspace with one, or
# the default-members list, so the other members would go unchecked.
run = "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"

[test]
description = "Unit and integration tests"
# --tests selects every target whose `test` flag is on: the library, bins, and
# integration tests. --lib adds nothing and fails a crate with no library.
# --bins would select every bin regardless of the flag, so a fuzz target with
# `test = false` would build and run as a test.
run = "cargo test --locked --workspace --all-features --tests"
# Stops a hung test run instead of holding the gate. The limit also counts
# compile time and waits on the target/ lock, so it sits far above a cold build.
timeout = "30m"

["test:doc"]
description = "Doc-tests"
run = "cargo test --locked --workspace --doc --all-features"
timeout = "30m"

[deny]
description = "License, ban, and source policy (offline)"
run = "cargo deny --locked check licenses bans sources"

["deny:advisories"]
description = "RustSec advisories and yanked crates (network)"
run = "cargo deny --locked check advisories"

[deps]
description = "Unused crate analysis"
# cargo-machete calls cargo metadata without --locked, which would rewrite a
# stale Cargo.lock while sibling tasks run. The locked metadata call fails
# first, so no task in verify ever writes the lock.
run = [
  "cargo metadata --locked --format-version 1 > /dev/null",
  "cargo-machete --with-metadata",
]

# A manifest version changes only on the Version PR, through a fragment.
# The release config is what declares releases, so a repository without one
# has no version to compare, and needs neither the `ver` task nor verctl. A
# repository with one includes verctl's `ver` task beside this catalog, and
# sets VERCTL_CONFIG when the config sits outside its mise.toml directory. A
# VERCTL_CONFIG that names no file fails, so a wrong path never turns the
# check off.
["check:versions"]
description = "Manifest versions match the default branch outside a Version PR"
run = '''
if [ -n "${VERCTL_CONFIG:-}" ] && [ ! -f "$VERCTL_CONFIG" ]; then
  echo "VERCTL_CONFIG=$VERCTL_CONFIG names no file" >&2
  exit 1
fi
config="${VERCTL_CONFIG:-.ctl/ver.yaml}"
if [ ! -f "$config" ]; then
  echo "no $config: this repository declares no releases, nothing to compare"
  exit 0
fi
mise run ver check --versions
'''

# Published crates only. CI runs it before packaging; it compares against the
# release on crates.io, at the release type the pending fragments allow, so a
# break fails unless a fragment already bumps the minor. It runs verctl's
# `ver` task, which a published crate includes beside this catalog with its
# release config. A crate with no release config fails here with that cause.
[semver]
description = "Public API changes against the last release (network)"
run = '''
config="${VERCTL_CONFIG:-.ctl/ver.yaml}"
if [ ! -f "$config" ]; then
  echo "no $config: semver runs verctl's ver task, which needs the release config" >&2
  exit 1
fi
mise run ver semver
'''

# Builds the docs as docs.rs does: on a nightly, with --cfg docsrs, and with
# every rustdoc warning denied. It always builds every feature, even for a
# crate whose docs.rs metadata lists fewer: features are additive, so this
# checks every gated item docs.rs could render, and lint and test compile the
# same set. One gap remains for such a crate: an intra-doc link to an item
# behind an unlisted feature resolves here but renders as plain text there. The [lints.rustdoc] lints fire only here; test:doc runs the
# doc-tests and not them.
[doc]
description = "rustdoc on a nightly with --cfg docsrs and every feature, warnings denied"
run = 'cargo +${RUST_NIGHTLY} doc --no-deps --all-features --locked'
env = { RUSTDOCFLAGS = "--cfg docsrs -D warnings", CARGO_TARGET_DIR = "target/rustdoc" }

# What doc cannot see, for a published crate: the docs.rs metadata of each
# library cargo would publish, which cargo metadata nests as
# .metadata.docs.rs, where all-features = true or an explicit features list
# chooses what docs.rs builds; the doc_cfg attribute of each such library
# with a feature besides default, which only lists others, as the exact line
# the standard prescribes; and any silencing of
# clippy::missing_{errors,panics}_doc. Naming either lint, or the pedantic
# group that holds them as a lint path, fails at any level, since a crate names them only
# to change their level; a TOML key fails for either lint at any level and for
# pedantic at allow. The search covers tracked Rust, TOML, and shell files
# and every file in a mise file-task directory. The patterns spell every
# literal through a bracket or a class, so this catalog never matches itself.
# git grep exits 1 on no match; any other failure fails the task instead of
# reading as clean.
["check:docs"]
description = "docs.rs metadata, feature labels, and error docs"
shell = "bash -c"
run = '''
set -euo pipefail

metadata=$(cargo metadata --no-deps --locked --format-version 1)

jq '[.packages[] | select(.publish != [] and any(.targets[]; any(.kind[]; . == "lib" or . == "proc-macro"))) | select((.metadata.docs.rs."all-features" != true and (.metadata.docs.rs.features | type) != "array") or ((.metadata.docs.rs."rustdoc-args" // []) as $a | ($a | index("--cap-lints")) as $i | $i == null or $a[$i + 1] != "warn")) | .name] | if length > 0 then error("✘ [package.metadata.docs.rs] needs all-features = true or a features list, and rustdoc-args = [\"--cap-lints\", \"warn\"] in: \(join(", "))") else empty end' <<<"$metadata"

jq -r '.packages[] | select(.publish != [] and (.features | del(.default) | length > 0)) | .targets[] | select(any(.kind[]; . == "lib" or . == "proc-macro")) | .src_path' <<<"$metadata" |
  while read -r root; do
    grep -q -F '#![cfg_attr(docsrs, feature(doc_cfg))]' "$root" || echo "✘ no #![cfg_attr(docsrs, feature(doc_cfg))] in $root"
  done |
  awk '{ print } END { exit NR > 0 }'

status=0
git grep -n -E \
  -e "clippy[[:space:]]*::[[:space:]]*missing[-_](errors|panics)[-_]doc" \
  -e "(^|[^[:alnum:]_-])[\"']?missing[-_](errors|panics)[-_]doc[\"']?[[:space:]]*[]=.]" \
  -e "clippy[[:space:]]*::[[:space:]]*pedanti[c]" \
  -e "(^|[^[:alnum:]_-])[\"']?pedantic[\"']?([[:space:]]*[.][[:space:]]*level)?[[:space:]]*=[[:space:]]*([\"']allow|[{][^}]*level[[:space:]]*=[[:space:]]*[\"']allow)" \
  -e "[[](workspace[.])?lints[.]clippy[.]pedantic[]]" \
  -- '*.rs' '*.toml' '*.sh' 'mise-tasks/**' '.mise-tasks/**' 'mise/tasks/**' '.mise/tasks/**' '.config/mise/tasks/**' || status=$?
case $status in
  0) echo "✘ clippy::missing_{errors,panics}_doc and the pedantic group must keep their default: name neither lint, and set pedantic only to warn or deny as a key in [lints.clippy], not as a table of its own"; exit 1 ;;
  1) ;;
  *) exit "$status" ;;
esac
'''
